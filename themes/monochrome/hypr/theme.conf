#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(bb9af7ff) rgba(b4f9f8ff) 45deg
    col.inactive_border = rgba(565f89cc) rgba(9aa5cecc) 45deg
    layout = dwindle
    resize_on_border = true
}

group {
    col.border_active = rgba(bb9af7ff) rgba(b4f9f8ff) 45deg
    col.border_inactive = rgba(565f89cc) rgba(9aa5cecc) 45deg
    col.border_locked_active = rgba(bb9af7ff) rgba(b4f9f8ff) 45deg
    col.border_locked_inactive = rgba(565f89cc) rgba(9aa5cecc) 45deg
}

decoration {
    rounding = 12
    shadow:enabled = false

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
# Animations
# animation=NAME,ONOFF,SPEED,CURVE,STYLE or
# animation=NAME,ONOFF,SPEED,CURVE
animations {
  bezier = easeOutExpo, 0.16, 1, 0.3, 1
  bezier = easeOutQuint, 0.22, 1, 0.36, 1
  animation = windows, 1, 6, default, popin # slide or popin
  animation = fade, 1, 8, default
  animation = border, 1, 8, default
  animation = borderangle, 1, 8, default
  animation = workspaces, 1, 4, default
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  match:namespace = rofi
}

layerrule {
  name = rofiOpen
  animation = popin 80%
  blur = on
  ignore_alpha = 0
  match:namespace = rofi
}

windowrule {
  name = blurAll
  opacity = 0.9
  match:focus = true
}
windowrule {
  name = blurUnfocuesed
  opacity = 0.7
  match:focus = false
}
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Capitaine-​Cursors-​Tokyonight
env = HYPRCURSOR_THEME,Capitaine-​Cursors-​Tokyonight
env = HYPRCURSOR_SIZE,24
exec-once = hyprctl setcursor Capitaine-​Cursors-​Tokyonight 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Capitaine-​Cursors-​Tokyonight'
