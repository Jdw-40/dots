# Tokyo Night color scheme for kitty terminal emulator
# https://github.com/davidmathers/tokyo-night-kitty-theme
#
# Based on Tokyo Night color theme for Visual Studio Code
# https://github.com/enkia/tokyo-night-vscode-theme

foreground #ECECEC
background #161d20

# Black
color0 #3a4b53
color8 #3a4b53

# Red
color1 #9b1320
color9 #9b1320

# Green
color2  #9cd0cb
color10 #9cd0cb

# Yellow
color3  #ca9c4b
color11 #ca9c4b

# Blue
color4  #4f848e
color12 #4f848e

# Magenta
color5  #c4614f
color13 #c4614f

# Cyan
color6  #9cd0cb
color14 #9cd0cb

# White
color7  #ECECEC
color15 #ECECEC

# Cursor
cursor #ECECEC
cursor_text_color #161d20

# Selection highlight
selection_foreground none
selection_background #4f848e

# The color for highlighting URLs on mouse-over
url_color #9cd0cb

# Window borders
active_border_color #4f848e
inactive_border_color #161d20
bell_border_color #ca9c4b

# Tab bar
tab_bar_style fade
tab_fade 1
active_tab_foreground   #9cd0cb
active_tab_background   #161d20
active_tab_font_style   bold
inactive_tab_foreground #4f848e
inactive_tab_background #161d20
inactive_tab_font_style bold
tab_bar_background #161d20

# Title bar
macos_titlebar_color #161d20

# Storm
# background #24283b
# cursor_text_color #24283b
# active_tab_background   #1f2335
# inactive_tab_background #1f2335
# macos_titlebar_color #1f2335
