###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds
bind = $mainMod, T, exec, $terminal                               # open kitty
bind = $mainMod, B, exec, $browser                                # open firefox
bind = $mainMod_SHIFT, F, exec, firefox --private-window          # firefox private window
bind = $mainMod, A, exec, $menu                                   # open rofi
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/clipboard.rasi | cliphist decode | wl-copy  # open rofi clipboard
bind = $mainMod, Q, killactive                                    # close active window
#bind = $mainMod, M, exit                                          # exit hyprland
bind = $mainMod, E, exec, $fileManager                            # open dolphin (file manager)
bind = CTRL|ALT, DELETE, exec, wlogout --layout ~/.config/wlogout/layout --css ~/.config/wlogout/style.css --buttons-per-row 4       # open wlogout
bind = $mainMod, L, exec, hyprlock                                # lock screen
bind = $mainMod, W, togglefloating                                # toggle floating
#bind = $mainMod, R, exec, $menu                                   # another rofi shortcut
bind = $mainMod, P, pseudo                                        # dwindle
bindd = $mainMod, J, $d toggle split, layoutmsg, togglesplit                                   # dwindle
bind = ALT, Tab, exec, hypr-alttab
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l                               # move focus left
bind = $mainMod, right, movefocus, r                              # move focus right
bind = $mainMod, up, movefocus, u                                 # move focus up
bind = $mainMod, down, movefocus, d                               # move focus down
#bind = $mainMod, F4, hyprexpo:expo, toggle                        # overview of workspaces
bind = $mainMod, TAB, exec, rofi -show window                     # shows active windows
bind = Alt, Tab, cyclenext                                        # change focus to another window
bind = Alt, Tab, bringactivetotop                                 # bring it to the top
bind = $mainMod, slash, exec, keybind-hint.sh  # keybind list
bind = $mainMod, period, exec, emoji.sh    # emoji picker
bind = $mainMod, comma,  exec, glyph.sh    # glyph picker
bind = $mainMod, R, exec, killall -SIGUSR1 waybar                  # hide waybar
bind = $mainMod SHIFT, R, exec, waybar_reload.sh   # reload waybar
bind = $mainMod CTRL, W,    exec, ~/.config/hypr/scripts/wall-random.sh   # random wallpaper
bind = $mainMod SHIFT, W, exec, wallpaper-select # select wallpaper
bind = $mainMod SHIFT, A, exec, rofi -show drun -theme ~/.config/rofi/fullscreenLauncher.rasi # full screen rofi drun menu
bind = Alt, F4, exec, hyprctl kill # kill active window
bind = $mainMod SHIFT, T, exec, theme-picker.sh # change theme
bind = $mainMod, H, exec, killall -SIGUSR1 hypr-dock
bind = $mainMod, F11, fullscreen 
bind = ALT SHIFT, C, exec, pkill -SIGUSR1 ie-r
bind = ALT SHIFT, H, exec, pkill -SIGUSR2 ie-r
$d = [Screen Capture]

# Color picker
bindd = $mainMod CTRL, P, $d color picker, exec, hyprpicker -an   # color picker

# Frozen region snip
bindd = $mainMod SHIFT, P, $d freeze and snip screen, exec, hyprshot -m region -D 0.5 -z --clipboard-only   # freeze and take screenshot of region


# Focused monitor screenshot
bindd = $mainMod ALT, P, $d print monitor, exec, hyprshot output -m output -m active -D 0.3 --clipboard only   # focused monitor screenshot

# All monitors screenshot
bindd = , Print, $d print all monitors, exec, sh -c 'dir=$(mktemp -d) && hyprshot -m output -o "$dir" && file=$(find "$dir" -type f -name "*.png" | head -n1) && satty -f "$file" --copy-command wl-copy && rm -rf "$dir"'   # screenshot all monitors


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move focused window to a workspace silently
$d = [ws | Navigation | Move window silently]
bindd = $mainMod Alt, 1, $d move to workspace 1 (silent), movetoworkspacesilent, 1
bindd = $mainMod Alt, 2, $d move to workspace 2 (silent), movetoworkspacesilent, 2
bindd = $mainMod Alt, 3, $d move to workspace 3 (silent), movetoworkspacesilent, 3
bindd = $mainMod Alt, 4, $d move to workspace 4 (silent), movetoworkspacesilent, 4
bindd = $mainMod Alt, 5, $d move to workspace 5 (silent), movetoworkspacesilent, 5
bindd = $mainMod Alt, 6, $d move to workspace 6 (silent), movetoworkspacesilent, 6
bindd = $mainMod Alt, 7, $d move to workspace 7 (silent), movetoworkspacesilent, 7
bindd = $mainMod Alt, 8, $d move to workspace 8 (silent), movetoworkspacesilent, 8
bindd = $mainMod Alt, 9, $d move to workspace 9 (silent), movetoworkspacesilent, 9
bindd = $mainMod Alt, 0, $d move to workspace 10 (silent), movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic                  # toggle scratchpad
bind = $mainMod SHIFT, S, movetoworkspace, special:magic           # send window to scratchpad

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +1  # vol up
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -1      # vol down
bindel = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle            # mute audio
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle       # mute mic
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness +5                   # brightness up
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness -5                 # brightness down

# Media keys (requires playerctl)
bindl = , XF86AudioNext, exec, playerctl next             # next track
bindl =, XF86AudioPlay, exec, swayosd-client --playerctl play-pause      # play/pause media
bindl = , XF86AudioPlay, exec, playerctl play-pause       # play/pause media
bindl = , XF86AudioPrev, exec, playerctl previous         # previous track
