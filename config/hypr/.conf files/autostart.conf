#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
#################
### AUTOSTART ###
#################
# hyprland plugins, idk if needed
exec-once = hyprpm update
exec-once = hyprpm reload -n

# idle + notifications
exec-once = hypridle
exec-once = swaync

# bar + wallpaper + osd
#exec-once = waybar --config ~/.config/waybar/config.jsonc
exec-once = ags run ~/.config/ags/Bar.tsx --gtk 4 #bar
exec-once = awww-daemon #wallpaper utility
exec-once = swayosd-server #on screen display, notifies of caps-lock, volume, ect.

# tray
exec-once = nm-applet
exec-once = blueman-applet

# Clipboard manager
exec-once = wl-paste --watch cliphist store
exec-once = ie-r
# set cursor theme
exec-once = hyprctl setcursor Capitaine-​Cursors-​Tokyonight 24
exec-once = systemctl --user start hyprpolkitagent
exec-once = arch-update --tray
exec-once = mpDris2
#dock:
exec-once=hypr-dock

#numlock on start
input:numlock_by_default = 1
